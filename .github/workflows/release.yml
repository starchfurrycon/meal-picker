name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.0）'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 package.json 与 tag 是否一致
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "package.json=$PKG tag=$REF"
          if [ "v$PKG" != "$REF" ]; then
            echo "::error::tag($REF) 与 package.json 版本(v$PKG) 不一致"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: 重新生成插画内联资源
        run: node scripts/embed-art.mjs

      - name: 生成采集器与平台地址
        run: node scripts/gen-collector.mjs

      - name: 打包
        run: node scripts/build.mjs

      - name: 冒烟测试
        run: node scripts/test.mjs

      - name: 发行包端到端自检
        run: node scripts/e2e-dist.mjs

      - name: 收集发行文件
        run: |
          mkdir -p release
          cp "dist/meal-picker-${{ steps.ver.outputs.version }}.zip" release/
          cp dist/meal-picker.html release/
          cp dist/meal-picker-collector.user.js release/
          cp dist/SHA256SUMS.txt release/
          ls -la release

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 选餐 ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## 选餐 ${{ steps.ver.outputs.tag }}

            **零安装**：启动中继后，它会自己拉起一个浏览器并注入采集器，
            你只需要在那个窗口里登录一次平台。想用自己的浏览器，再到设置里切成油猴模式。

            | 文件 | 说明 |
            | --- | --- |
            | `meal-picker-${{ steps.ver.outputs.version }}.zip` | **推荐**：单文件版 + 目录版 + `relay/` 中继 + `collector/` 采集器 + 插画源文件 |
            | `meal-picker-collector.user.js` | 采集器用户脚本（只在"用我自己的浏览器"模式下需要） |
            | `meal-picker.html` | 单文件版，需配合中继才有实时价 |
            | `SHA256SUMS.txt` | 校验和 |

            ### 两步

            1. 解压 zip，`node relay/server.mjs`（Windows 可双击 `relay/启动.cmd`）——
               它会自动打开 <http://127.0.0.1:8765/>
            2. 在工具页面输入一句话点「开始筛选」。中继会自动拉起浏览器、装好采集器、
               打开各平台搜索页；在那个窗口里登录一次美团 / 淘宝闪购 / 京东即可

            > **没有模拟数据。** 拿不到实时价时工具会直接说明缺哪个平台，不会编造价格。
            > 价格来自你自己浏览器里、你自己账号可见的页面数据；列表页报价仅供参考，
            > 最终成交价以各平台结算页为准。

            > 在线版 <https://starchfurrycon.github.io/meal-picker/> 只能浏览界面：
            > https 页面被浏览器禁止请求本地 http 中继。
          files: |
            release/meal-picker.html
            release/meal-picker-collector.user.js
            release/meal-picker-${{ steps.ver.outputs.version }}.zip
            release/SHA256SUMS.txt
