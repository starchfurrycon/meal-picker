name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 重新生成插画内联资源
        run: node scripts/embed-art.mjs

      - name: 打包
        run: node scripts/build.mjs

      - name: 冒烟测试
        run: node scripts/test.mjs

      - name: 准备 Pages 站点
        run: |
          mkdir -p _site
          cp -r dist/web/* _site/
          cp dist/meal-picker.html _site/meal-picker.html
          mkdir -p _site/assets
          cp -r dist/assets/* _site/assets/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
