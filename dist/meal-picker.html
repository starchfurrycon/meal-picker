<style>
/* ─────────────────────────────────────────────
   设计令牌 · 选餐
   全部颜色 / 间距 / 圆角 / 动效集中在此，改这里即可换肤
   ───────────────────────────────────────────── */
:root {
  /* 色板（与 assets/dishes 插画同一套体系） */
  --c-cream:        #FFF7EF;
  --c-cream-deep:   #FFF4E6;
  --c-sand:         #F0DFC8;
  --c-sand-line:    #E2CDB2;
  --c-ink:          #4A3B2E;
  --c-ink-soft:     #6B5A49;
  --c-ink-faint:    #9C8B79;
  --c-orange:       #FF8A3D;
  --c-orange-deep:  #F0701E;
  --c-tomato:       #E5533D;
  --c-honey:        #FFC857;
  --c-matcha:       #6FB07F;
  --c-matcha-deep:  #3E7A52;
  --c-cocoa:        #8B5E3C;
  --c-plum:         #9B6BB5;
  --c-sky:          #5AA9E6;
  --c-white:        #FFFFFF;

  /* 语义色 */
  --bg:             var(--c-cream);
  --surface:        rgba(255, 255, 255, .86);
  --surface-solid:  var(--c-white);
  --line:           rgba(74, 59, 46, .10);
  --line-strong:    rgba(74, 59, 46, .18);
  --text:           var(--c-ink);
  --text-soft:      var(--c-ink-soft);
  --text-faint:     var(--c-ink-faint);
  --accent:         var(--c-orange);
  --accent-deep:    var(--c-orange-deep);
  --good:           var(--c-matcha-deep);

  /* 平台色 */
  --p-jd:      #E1251B;
  --p-meituan: #FFC300;
  --p-taobao:  #FF5000;
  --p-eleme:   #1E90FF;

  /* 圆角 */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;
  --r-pill: 999px;

  /* 间距 */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 22px;
  --s-6: 30px;
  --s-7: 42px;
  --s-8: 60px;

  /* 阴影 */
  --sh-1: 0 1px 2px rgba(74, 59, 46, .06), 0 2px 8px rgba(74, 59, 46, .05);
  --sh-2: 0 4px 14px rgba(74, 59, 46, .08), 0 12px 32px rgba(74, 59, 46, .07);
  --sh-3: 0 10px 30px rgba(74, 59, 46, .12), 0 30px 70px rgba(74, 59, 46, .10);
  --sh-warm: 0 10px 26px rgba(255, 138, 61, .28);

  /* 字体 */
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC",
          "Source Han Sans SC", "Microsoft YaHei UI", "Microsoft YaHei",
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "SF Mono", "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  /* 动效 */
  --ease-out: cubic-bezier(.22, .8, .28, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .5, 1);
  --ease-in-out: cubic-bezier(.5, .05, .2, 1);
  --t-fast: 160ms;
  --t-mid: 300ms;
  --t-slow: 520ms;

  --shadow-color: 74 59 46;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #1C1712;
    --surface:       rgba(45, 37, 30, .82);
    --surface-solid: #2A231C;
    --line:          rgba(255, 240, 224, .10);
    --line-strong:   rgba(255, 240, 224, .20);
    --text:          #F6EADB;
    --text-soft:     #D8C6B2;
    --text-faint:    #A99580;
    --c-sand:        #3A2F25;
    --c-sand-line:   #4C3E31;
    --sh-1: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.24);
    --sh-2: 0 4px 14px rgba(0,0,0,.36), 0 12px 32px rgba(0,0,0,.3);
    --sh-3: 0 10px 30px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  overscroll-behavior: none;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.ico {
  width: 1.25em;
  height: 1.25em;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* ─────────────────────────────────────────────
   选餐 · 主样式
   ───────────────────────────────────────────── */

/* ══════════ 背景氛围 ══════════ */
.ambient {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.ambient__blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .55;
  will-change: transform;
}
.ambient__blob--a {
  width: 46vmax; height: 46vmax;
  top: -18vmax; left: -12vmax;
  background: radial-gradient(circle at 35% 35%, rgba(255,138,61,.55), rgba(255,138,61,0) 68%);
  animation: drift-a 26s var(--ease-in-out) infinite;
}
.ambient__blob--b {
  width: 40vmax; height: 40vmax;
  bottom: -16vmax; right: -10vmax;
  background: radial-gradient(circle at 60% 40%, rgba(111,176,127,.45), rgba(111,176,127,0) 68%);
  animation: drift-b 32s var(--ease-in-out) infinite;
}
.ambient__blob--c {
  width: 34vmax; height: 34vmax;
  top: 40%; left: 55%;
  background: radial-gradient(circle at 50% 50%, rgba(255,200,87,.42), rgba(255,200,87,0) 70%);
  animation: drift-c 38s var(--ease-in-out) infinite;
}
.ambient__grain {
  position: absolute;
  inset: -50%;
  opacity: .035;
  background-image: radial-gradient(rgba(74,59,46,.9) 1px, transparent 1px);
  background-size: 4px 4px;
  animation: grain 6s steps(6) infinite;
}
@keyframes drift-a {
  0%,100% { transform: translate3d(0,0,0) scale(1); }
  50%     { transform: translate3d(6vmax,4vmax,0) scale(1.12); }
}
@keyframes drift-b {
  0%,100% { transform: translate3d(0,0,0) scale(1.06); }
  50%     { transform: translate3d(-5vmax,-3vmax,0) scale(.94); }
}
@keyframes drift-c {
  0%,100% { transform: translate3d(0,0,0) scale(.95); }
  50%     { transform: translate3d(-4vmax,5vmax,0) scale(1.1); }
}
@keyframes grain {
  0%   { transform: translate(0,0); }
  20%  { transform: translate(-2px,1px); }
  40%  { transform: translate(1px,-2px); }
  60%  { transform: translate(-1px,-1px); }
  80%  { transform: translate(2px,2px); }
  100% { transform: translate(0,0); }
}

/* ══════════ 视图容器 ══════════ */
.app {
  position: relative;
  z-index: 1;
  height: 100%;
  height: 100dvh;
  display: grid;
  place-items: stretch;
}
.view {
  grid-area: 1 / 1;
  display: none;
  min-height: 0;
}
.view.is-on { display: flex; }

/* 视图切换转场 */
.view.is-on { animation: view-in var(--t-slow) var(--ease-out) both; }
.view.is-out { display: flex; animation: view-out 240ms var(--ease-in-out) both; pointer-events: none; }
@keyframes view-in {
  from { opacity: 0; transform: translate3d(0, 16px, 0) scale(.985); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
@keyframes view-out {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translate3d(0, -10px, 0) scale(.99); filter: blur(6px); }
}

/* ══════════ 首页 ══════════ */
.view--home {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: var(--s-6) var(--s-5) var(--s-7);
  gap: var(--s-6);
}
.brand {
  text-align: center;
  animation: rise 700ms var(--ease-out) both;
}
.brand__mark {
  display: inline-grid;
  place-items: center;
  width: 68px; height: 68px;
  margin-bottom: var(--s-4);
  border-radius: 24px;
  background: linear-gradient(150deg, var(--c-orange), var(--c-tomato));
  color: #fff;
  box-shadow: var(--sh-warm);
  animation: bob 5.5s var(--ease-in-out) infinite;
}
.brand__mark .ico { width: 34px; height: 34px; stroke-width: 1.5; }
@keyframes bob {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50%     { transform: translateY(-7px) rotate(2deg); }
}
.brand__title {
  margin: 0;
  font-size: clamp(30px, 7.4vw, 46px);
  font-weight: 800;
  letter-spacing: .01em;
  background: linear-gradient(96deg, var(--c-ink) 20%, var(--c-orange-deep) 78%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand__sub {
  margin: var(--s-3) 0 0;
  font-size: 15px;
  color: var(--text-soft);
  letter-spacing: .04em;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}

.ask {
  width: min(660px, 100%);
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
  animation: rise 700ms 90ms var(--ease-out) both;
}
.ask__field {
  display: flex;
  align-items: flex-end;
  gap: var(--s-2);
  padding: 10px 10px 10px var(--s-5);
  background: var(--surface);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-2);
  transition: box-shadow var(--t-mid) var(--ease-out), border-color var(--t-mid), transform var(--t-mid) var(--ease-out);
}
.ask__field:focus-within {
  border-color: rgba(255,138,61,.5);
  box-shadow: var(--sh-3), 0 0 0 5px rgba(255,138,61,.10);
  transform: translateY(-2px);
}
.ask__input {
  flex: 1;
  min-height: 42px;
  max-height: 132px;
  padding: 10px 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  font-size: 17px;
  line-height: 1.5;
}
.ask__input::placeholder { color: var(--text-faint); }
.ask__send {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 46px; height: 46px;
  border: 0;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--c-orange), var(--c-orange-deep));
  color: #fff;
  cursor: pointer;
  box-shadow: var(--sh-warm);
  transition: transform var(--t-fast) var(--ease-spring), box-shadow var(--t-fast), opacity var(--t-fast);
}
.ask__send .ico { width: 21px; height: 21px; transform: translateX(-1px); }
.ask__send:hover { transform: scale(1.08) rotate(4deg); }
.ask__send:active { transform: scale(.94); }
.ask__send:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  justify-content: center;
}
.chip {
  padding: 8px 15px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--surface);
  backdrop-filter: blur(10px);
  color: var(--text-soft);
  font-size: 13.5px;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease-out);
}
.chip:hover {
  color: var(--accent-deep);
  border-color: rgba(255,138,61,.45);
  background: rgba(255,138,61,.08);
  transform: translateY(-2px);
}

.home-foot {
  position: absolute;
  left: var(--s-5);
  right: var(--s-5);
  bottom: max(var(--s-5), env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  animation: rise 700ms 180ms var(--ease-out) both;
}
.home-foot__hint {
  font-size: 12.5px;
  color: var(--text-faint);
  text-align: right;
}

/* ══════════ 按钮 ══════════ */
.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--surface);
  backdrop-filter: blur(12px);
  color: var(--text-soft);
  font-size: 13.5px;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease-out);
}
.ghost-btn .ico { width: 16px; height: 16px; }
.ghost-btn:hover {
  color: var(--text);
  border-color: rgba(74,59,46,.3);
  transform: translateY(-1px);
  box-shadow: var(--sh-1);
}
.ghost-btn--warm:hover {
  color: var(--accent-deep);
  border-color: rgba(255,138,61,.45);
  background: rgba(255,138,61,.09);
}
.icon-btn {
  display: grid;
  place-items: center;
  width: 40px; height: 40px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--surface);
  backdrop-filter: blur(12px);
  color: var(--text-soft);
  cursor: pointer;
  transition: all var(--t-fast) var(--ease-out);
}
.icon-btn .ico { width: 19px; height: 19px; }
.icon-btn:hover { color: var(--text); transform: scale(1.06); box-shadow: var(--sh-1); }
.icon-btn:active { transform: scale(.94); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--surface-solid);
  color: var(--text);
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease-out);
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--sh-1); }
.btn--primary {
  border-color: transparent;
  background: linear-gradient(145deg, var(--c-orange), var(--c-orange-deep));
  color: #fff;
  box-shadow: var(--sh-warm);
}
.btn--primary:hover { box-shadow: var(--sh-3), var(--sh-warm); }
.btn--danger { color: var(--c-tomato); border-color: rgba(229,83,61,.35); }
.btn--danger:hover { background: rgba(229,83,61,.08); }
.btn--block { width: 100%; }

/* ══════════ 加载过场 ══════════ */
.view--thinking {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--s-6) var(--s-5) var(--s-8);
}
.think {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--s-3);
}
.think__orb {
  position: relative;
  width: 132px; height: 132px;
  display: grid;
  place-items: center;
  margin-bottom: var(--s-4);
}
.think__ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--c-orange);
  border-right-color: rgba(255,138,61,.25);
}
.think__ring--1 { inset: 0;    animation: spin 1.5s linear infinite; }
.think__ring--2 { inset: 14px; border-top-color: var(--c-honey); animation: spin 2.1s linear infinite reverse; }
.think__ring--3 { inset: 28px; border-top-color: var(--c-matcha); animation: spin 2.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.think__core {
  display: grid;
  place-items: center;
  width: 54px; height: 54px;
  border-radius: 20px;
  background: linear-gradient(150deg, var(--c-orange), var(--c-tomato));
  color: #fff;
  box-shadow: var(--sh-warm);
  animation: pulse 1.8s var(--ease-in-out) infinite;
}
.think__core .ico { width: 28px; height: 28px; stroke-width: 1.5; }
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.08); }
}
.think__plate {
  position: absolute;
  inset: 42px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,138,61,.18), transparent 70%);
  animation: pulse 2.4s var(--ease-in-out) infinite;
}
.think__title {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .01em;
}
.think__detail {
  margin: 0;
  font-size: 13.5px;
  color: var(--text-faint);
  min-height: 20px;
  transition: opacity var(--t-fast);
}
.think__steps {
  list-style: none;
  margin: var(--s-5) 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: min(360px, 88vw);
  text-align: left;
}
.think__steps li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-radius: var(--r-sm);
  font-size: 13.5px;
  color: var(--text-faint);
  opacity: .45;
  transition: all var(--t-mid) var(--ease-out);
}
.think__steps li.is-on {
  opacity: 1;
  color: var(--text);
  background: rgba(255,138,61,.08);
  transform: translateX(4px);
}
.think__steps li.is-done { opacity: .8; color: var(--text-soft); }
.think__steps li .dot {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.6px solid currentColor;
  font-size: 11px;
  font-weight: 700;
}
.think__steps li.is-done .dot {
  border-color: transparent;
  background: var(--c-matcha);
  color: #fff;
}
.think__steps li.is-on .dot {
  border-color: var(--c-orange);
  border-top-color: transparent;
  animation: spin .9s linear infinite;
}
.think__steps li .dot .ico { width: 12px; height: 12px; stroke-width: 2.4; }
.think__meta {
  margin: var(--s-4) 0 0;
  font-size: 12px;
  color: var(--text-faint);
  min-height: 18px;
  letter-spacing: .02em;
}
.think-foot {
  position: absolute;
  bottom: max(var(--s-6), env(safe-area-inset-bottom));
  animation: rise 600ms 260ms var(--ease-out) both;
}

/* ══════════ 结果 ══════════ */
.view--result {
  flex-direction: column;
  align-items: center;
  padding: 0;
}
.result__back {
  position: absolute;
  top: max(var(--s-4), env(safe-area-inset-top));
  left: var(--s-4);
  z-index: 5;
  animation: rise 500ms var(--ease-out) both;
}
.result__scroll {
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-4);
  padding: calc(var(--s-7) + 14px) var(--s-5) var(--s-5);
}
.result__foot {
  display: flex;
  gap: var(--s-3);
  padding: 0 var(--s-5) max(var(--s-5), env(safe-area-inset-bottom));
  animation: rise 600ms 320ms var(--ease-out) both;
}

/* 卡片 */
.card {
  position: relative;
  width: min(520px, 100%);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-3);
  overflow: hidden;
  animation: card-in 780ms var(--ease-spring) both;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(40px) scale(.94); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: none; }
}
.card__hero {
  position: relative;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: linear-gradient(160deg, var(--c-cream-deep), var(--c-sand));
}
.card__art {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  animation: art-in 1100ms var(--ease-out) both;
}
.card__art svg { width: 74%; height: 74%; }
@keyframes art-in {
  from { opacity: 0; transform: scale(.86) rotate(-4deg); }
  to   { opacity: 1; transform: none; }
}
.card__art::after {
  content: "";

.card__deals {

.card__why {

.card__quotes {

}
.card__quotes q {
  font-size: 12.5px;

  padding-left: 10px;
  border-left: 2px solid rgba(111,176,127,.35);
}

.card__score {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}
.card__score-bar {
  flex: 1;

  border-radius: var(--r-pill);
  background: var(--c-sand);

}
.card__score-fill {
  height: 100%;

}
.card__score-num {
  font-family: var(--font-num);

}
.card__actions .btn { flex: 1; }

/* 结果页底部提示 */
.result__note {
  width: min(520px, 100%);

  line-height: 1.7;

}

/* 空/错误态 */
.empty {
  width: min(460px, 100%);
  text-align: center;
  padding: var(--s-6) var(--s-5);

  flex-direction: column;
  align-items: center;
  gap: var(--s-4);
  animation: card-in 600ms var(--ease-spring) both;
}
.empty__art {
  width: 96px; height: 96px;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: var(--c-cream-deep);

}

.empty h2 { margin: 0; font-size: 19px; }
.empty p { margin: 0; font-size: 14px; color: var(--text-soft); line-height: 1.7; }

/* 骨架屏 */
.skeleton {
  width: min(520px, 100%);
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
}
.sk-line {
  height: 14px;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--c-sand) 25%, rgba(255,255,255,.6) 50%, var(--c-sand) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ══════════ 设置面板 ══════════ */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: 1fr;
  justify-items: stretch;
}
.sheet[hidden] { display: none; }
.sheet__scrim {
  position: absolute;
  inset: 0;
  background: rgba(45, 35, 26, .34);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity var(--t-mid) var(--ease-out);
}
.sheet.is-open .sheet__scrim { opacity: 1; }
.sheet__panel {
  position: absolute;
  top: 0; bottom: 0; right: 0;
  width: min(520px, 100%);
  display: flex;
  flex-direction: column;
  background: var(--bg);
  box-shadow: var(--sh-3);
  transform: translateX(102%);
  transition: transform var(--t-slow) var(--ease-out);
  will-change: transform;
}
.sheet.is-open .sheet__panel { transform: none; }
@media (max-width: 560px) {
  .sheet__panel {
    top: auto;
    left: 0;
    width: 100%;
    height: min(92dvh, 100%);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    transform: translateY(102%);
  }
}
.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(var(--s-5), env(safe-area-inset-top)) var(--s-5) var(--s-3);
}
.sheet__title { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .01em; }

.tabs {
  display: flex;
  gap: 6px;
  padding: 0 var(--s-5) var(--s-3);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  padding: 8px 15px;
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--text-faint);
  font-size: 13.5px;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease-out);
}
.tab:hover { color: var(--text); background: rgba(74,59,46,.05); }
.tab.is-on {
  color: #fff;
  background: linear-gradient(145deg, var(--c-orange), var(--c-orange-deep));
  box-shadow: var(--sh-warm);
}

.sheet__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--s-2) var(--s-5) var(--s-8);
}
.pane { display: flex; flex-direction: column; gap: var(--s-4); }
.pane.is-on { animation: pane-in 380ms var(--ease-out) both; }
@keyframes pane-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.group {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  overflow: hidden;
  transition: border-color var(--t-fast);
}
.group__head {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4);
  cursor: pointer;
  user-select: none;
}
.group__head:hover { background: rgba(74,59,46,.025); }
.group__logo {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 40px; height: 40px;
  border-radius: var(--r-sm);
  background: var(--p-tint, rgba(255,138,61,.14));
  color: var(--p-color, var(--accent));
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.02em;
}
.group__meta { flex: 1; min-width: 0; }
.group__name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.group__desc { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
.group__chev {
  flex: 0 0 auto;
  color: var(--text-faint);
  transition: transform var(--t-mid) var(--ease-out);
}
.group.is-open .group__chev { transform: rotate(90deg); }
.group__body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--t-slow) var(--ease-out);
}
.group.is-open .group__body { grid-template-rows: 1fr; }
.group__inner {
  overflow: hidden;
  min-height: 0;
}
.group__inner-pad {
  padding: 0 var(--s-4) var(--s-4);
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  border-top: 1px solid var(--line);
  padding-top: var(--s-4);
  margin-top: 2px;
}

/* 开关 */
.switch {
  position: relative;
  flex: 0 0 auto;
  width: 46px; height: 27px;
  border-radius: var(--r-pill);
  border: 0;
  background: var(--c-sand);
  cursor: pointer;
  transition: background var(--t-mid) var(--ease-out);
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 21px; height: 21px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--sh-1);
  transition: transform var(--t-mid) var(--ease-spring);
}
.switch[aria-checked="true"] { background: linear-gradient(145deg, var(--c-orange), var(--c-orange-deep)); }
.switch[aria-checked="true"]::after { transform: translateX(19px); }

/* 字段 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-soft);
  display: flex;
  align-items: center;
  gap: 6px;
}
.field__label .ico { width: 14px; height: 14px; color: var(--text-faint); }
.field__hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.6; }
.input, .select {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--bg);
  font-size: 14px;
  outline: 0;
  transition: all var(--t-fast) var(--ease-out);
}
.input:focus, .select:focus {
  border-color: rgba(255,138,61,.55);
  box-shadow: 0 0 0 4px rgba(255,138,61,.10);
}
.input::placeholder { color: var(--text-faint); }
.row { display: flex; gap: var(--s-2); align-items: flex-end; }
.row > .field { flex: 1; }
.input-affix { position: relative; flex: 1; }
.input-affix .input { padding-right: 46px; }
.input-affix__btn {
  position: absolute;
  right: 5px; top: 50%;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
}
.input-affix__btn:hover { color: var(--text); background: rgba(74,59,46,.06); }

/* 滑杆 */
.slider-row {
  display: grid;
  grid-template-columns: 88px 1fr 42px;
  align-items: center;
  gap: var(--s-3);
  padding: 9px 0;
}
.slider-row__name { font-size: 13px; color: var(--text-soft); }
.slider-row__val {
  font-family: var(--font-num);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--accent-deep);
  text-align: right;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--c-sand);
  outline: 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 19px; height: 19px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--c-orange);
  box-shadow: var(--sh-1);
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease-spring);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.14); }
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--c-orange);
  cursor: pointer;
}

/* 复选行 */
.check-row {
  display: flex;
  align-items: flex-start;
  gap: var(--s-3);
  padding: 11px 0;
  cursor: pointer;
}
.check-row + .check-row { border-top: 1px dashed var(--line); }
.check-row__box {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 22px; height: 22px;
  margin-top: 1px;
  border: 1.8px solid var(--line-strong);
  border-radius: 7px;
  color: transparent;
  transition: all var(--t-fast) var(--ease-out);
}
.check-row__box .ico { width: 13px; height: 13px; stroke-width: 2.6; }
.check-row.is-on .check-row__box {
  background: linear-gradient(145deg, var(--c-orange), var(--c-orange-deep));
  border-color: transparent;
  color: #fff;
}
.check-row__text { flex: 1; }
.check-row__t { font-size: 13.5px; font-weight: 600; }
.check-row__d { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; line-height: 1.6; }

/* 提示块 */
.note {
  display: flex;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--r-md);
  background: rgba(90,169,230,.09);
  border: 1px solid rgba(90,169,230,.22);
  font-size: 12.5px;
  line-height: 1.68;
  color: var(--text-soft);
}
.note .ico { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; color: var(--c-sky); }
.note--warn { background: rgba(255,200,87,.13); border-color: rgba(255,200,87,.36); }
.note--warn .ico { color: var(--c-cocoa); }
.note--good { background: rgba(111,176,127,.11); border-color: rgba(111,176,127,.28); }
.note--good .ico { color: var(--good); }
.note b { color: var(--text); }

.section-title {
  margin: var(--s-4) 0 calc(var(--s-1) * -1);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--s-2);
}
.stat {
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--c-cream-deep);
}
.stat__v { font-family: var(--font-num); font-size: 17px; font-weight: 800; }
.stat__k { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

/* ══════════ Toast ══════════ */
.toast-stack {
  position: fixed;
  left: 50%;
  bottom: max(var(--s-6), env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-2);
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 18px;
  border-radius: var(--r-pill);
  background: rgba(45, 35, 26, .92);
  backdrop-filter: blur(10px);
  color: #FDF4E9;
  font-size: 13.5px;
  box-shadow: var(--sh-2);
  animation: toast-in 380ms var(--ease-spring) both;
  max-width: min(86vw, 420px);
}
.toast .ico { width: 16px; height: 16px; flex: 0 0 auto; color: var(--c-honey); }
.toast.is-out { animation: toast-out 260ms var(--ease-in-out) both; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(16px) scale(.94); }
  to   { opacity: 1; transform: none; }
}
@keyframes toast-out {
  to { opacity: 0; transform: translateY(-8px) scale(.97); }
}

/* ══════════ 滚动条 ══════════ */
.result__scroll::-webkit-scrollbar,
.sheet__body::-webkit-scrollbar { width: 8px; }
.result__scroll::-webkit-scrollbar-thumb,
.sheet__body::-webkit-scrollbar-thumb {
  background: rgba(74,59,46,.16);
  border-radius: var(--r-pill);
  border: 2px solid transparent;
  background-clip: padding-box;
}

<main id="app" class="app">

  <!-- ─────────────── 首页 ─────────────── -->
  <section class="view view--home" data-view="home" aria-label="开始选餐">
    <header class="brand">
      <span class="brand__mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><use href="#i-bowl"/></svg></span>
      <h1 class="brand__title">今天吃什么</h1>
      <p class="brand__sub">说一句就行，剩下的交给我</p>
    </header>

    <form class="ask" id="ask-form" autocomplete="off">
      <div class="ask__field">
        <textarea id="ask-input" class="ask__input" rows="1" maxlength="120"
          placeholder="比如：想吃点辣的，别太贵，一个人吃" aria-label="描述你今天想吃什么"></textarea>
        <button class="ask__send" id="ask-send" type="submit" aria-label="开始选餐">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-send"/></svg>
        </button>
      </div>
      <div class="chips" id="chips" aria-label="快捷灵感">
        <button class="chip" type="button" data-q="想吃辣的，预算三十以内">来点辣的</button>
        <button class="chip" type="button" data-q="想吃点清淡的，最近在控制体重">清淡减脂</button>
        <button class="chip" type="button" data-q="想喝碗热汤面，暖和一下">热汤面</button>
        <button class="chip" type="button" data-q="想吃米饭类的家常菜">米饭家常</button>
      </div>
    </form>

    <footer class="home-foot">
      <button class="ghost-btn" id="open-settings" type="button">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-settings"/></svg>
        <span>设置</span>
      </button>
      <span class="home-foot__hint" id="home-hint"></span>
    </footer>
  </section>

  <!-- ─────────────── 加载过场 ─────────────── -->
  <section class="view view--thinking" data-view="thinking" aria-label="正在为你比价" aria-live="polite">
    <div class="think">
      <div class="think__orb">
        <span class="think__ring think__ring--1"></span>
        <span class="think__ring think__ring--2"></span>
        <span class="think__ring think__ring--3"></span>
        <span class="think__core"><svg class="ico" viewBox="0 0 24 24"><use href="#i-bowl"/></svg></span>
        <span class="think__plate"></span>
      </div>

      <p class="think__title" id="think-title">正在理解你的口味</p>
      <p class="think__detail" id="think-detail">把这句话变成能搜的关键词</p>

      <ol class="think__steps" id="think-steps"></ol>
      <p class="think__meta" id="think-meta"></p>
    </div>

    <div class="think-foot">
      <button class="ghost-btn ghost-btn--warm" id="think-undo" type="button">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-undo"/></svg>
        <span>我改主意了</span>
      </button>
    </div>
  </section>

  <!-- ─────────────── 结果 ─────────────── -->
  <section class="view view--result" data-view="result" aria-label="推荐结果">
    <button class="icon-btn result__back" id="result-back" type="button" aria-label="返回">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-back"/></svg>
    </button>

    <div class="result__scroll" id="result-scroll"></div>

    <div class="result__foot" id="result-foot">
      <button class="ghost-btn" id="result-again" type="button">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-shuffle"/></svg>
        <span>换一个</span>
      </button>
      <button class="ghost-btn ghost-btn--warm" id="result-undo" type="button">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-undo"/></svg>
        <span>我改主意了</span>
      </button>
    </div>
  </section>
</main>

<!-- ─────────────── 设置 ─────────────── -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close="1"></div>
  <section class="sheet__panel" role="dialog" aria-modal="true" aria-label="设置">
    <header class="sheet__head">
      <h2 class="sheet__title">设置</h2>
      <button class="icon-btn" id="close-settings" type="button" aria-label="关闭设置">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
    </header>

    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab is-on" role="tab" data-tab="platforms" type="button">平台</button>
      <button class="tab" role="tab" data-tab="taste" type="button">口味</button>
      <button class="tab" role="tab" data-tab="llm" type="button">智能转写</button>
      <button class="tab" role="tab" data-tab="privacy" type="button">隐私</button>
    </nav>

    <div class="sheet__body" id="sheet-body"></div>
  </section>
</div>
